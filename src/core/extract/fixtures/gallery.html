<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Gallery fixture</title>

        <meta property="og:image" content="/social/share.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Share card" />
        <meta
            property="og:video"
            content="https://cdn.example.test/promo.mp4" />
        <meta
            name="twitter:image"
            content="https://cdn.example.test/twitter-card.jpg" />
        <meta name="description" content="not a media tag" />

        <style>
            .hero {
                background-image: url("/css/hero-2400.jpg");
                color: red;
            }
            .decor {
                background: #000 url("/css/decor.png") no-repeat;
            }
            .font-rule {
                src: url("/fonts/inter.woff2");
            }
        </style>

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@graph": [
                    {
                        "@type": "Article",
                        "headline": "Deep in the graph",
                        "image": {
                            "@type": "ImageObject",
                            "contentUrl": "https://cdn.example.test/jsonld-hero.jpg",
                            "width": 2000,
                            "height": 1333,
                            "caption": "Buried image object"
                        },
                        "video": {
                            "@type": "VideoObject",
                            "contentUrl": "https://cdn.example.test/jsonld-clip.mp4",
                            "thumbnailUrl": "https://cdn.example.test/jsonld-thumb.jpg"
                        }
                    }
                ]
            }
        </script>

        <script type="application/ld+json">
            { this is not valid json
        </script>
    </head>

    <body>
        <div
            class="hero"
            style="background-image: url(/inline/banner.webp)"></div>

        <img
            src="/img/plain.jpg"
            alt="A plain image"
            width="800"
            height="600" />

        <img
            src="/img/small.jpg"
            srcset="
                /img/small.jpg   400w,
                /img/medium.jpg  800w,
                /img/large.jpg  1600w
            "
            alt="Responsive photo"
            width="400" />

        <img data-src="/img/lazy.png" alt="Lazy loaded" />

        <img src="/img/animated.gif" alt="An animation" />

        <picture>
            <source
                srcset="/img/hero.avif 1x, /img/hero@2x.avif 2x"
                type="image/avif" />
            <source srcset="/img/hero.webp" type="image/webp" />
            <img src="/img/hero.jpg" alt="Hero fallback" />
        </picture>

        <video
            poster="/video/poster.jpg"
            width="1280"
            height="720"
            title="Product tour">
            <source src="/video/tour.webm" type="video/webm" />
            <source src="/video/tour.mp4" type="video/mp4" />
        </video>

        <video src="https://cdn.example.test/live/stream.m3u8"></video>

        <iframe
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            title="Embedded talk"
            width="560"
            height="315"></iframe>
        <iframe
            src="https://player.vimeo.com/video/76979871"
            title="Vimeo clip"></iframe>
        <iframe
            src="https://www.google.com/maps/embed?pb=abc"
            title="Where we are"></iframe>

        <a class="lightbox" href="/full/plate-01.jpg" data-fancybox="album">
            <img src="/thumbs/plate-01.jpg" alt="Plate one" />
        </a>
        <a href="/album/plate-02/" data-large="/full/plate-02.jpg">
            <img src="/thumbs/plate-02.jpg" alt="Plate two" />
        </a>
        <!-- A tokenised endpoint: the extension is not in the last path
             segment, and the thumbnail lives on a different host. -->
        <a
            href="/get_image/2/9f2c8ad1/21663.jpg/?1-acctoken=abc123"
            class="item"
            rel="images"
            data-fancybox-type="image">
            <img
                class="thumb lazy-load"
                src="https://cdn.example.test/albums/200x150/1621664.jpg"
                alt="Plate three"
                width="200"
                height="150" />
        </a>

        <a href="/gallery/page-2">Next page</a>
    </body>
</html>
